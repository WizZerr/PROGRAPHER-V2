name: LB-01 research contract

on:
  pull_request:
    paths:
      - '.github/workflows/lb01-research-contract.yml'
      - 'backend/app/lightroom_bridge/**'
      - 'backend/tests/test_lb01_lightroom_poc.py'
      - 'integrations/lightroom_classic/lb01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: LB-01 synthetic contract tests (no Lightroom or customer data)
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_lb01_lightroom_poc.py
